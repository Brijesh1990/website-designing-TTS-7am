<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>
    @keyframes float {
        0%,100% {
            transform: translateY(0px);
        }
        50% {
            transform: translateY(-20px);
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(80px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes slideLeft {
        from {
            opacity: 0;
            transform: translateX(-80px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @keyframes pulseGlow {
        0%,100% {
            box-shadow: 0 0 20px rgba(99,102,241,.4);
        }
        50% {
            box-shadow: 0 0 50px rgba(168,85,247,.8);
        }
    }

    .float-animation {
        animation: float 4s ease-in-out infinite;
    }

    .slide-up {
        animation: slideUp 1s ease forwards;
    }

    .slide-left {
        animation: slideLeft 1s ease forwards;
    }

    .glow-btn {
        animation: pulseGlow 2s infinite;
    }
</style>
</head>

<body class="overflow-hidden">

<section class="relative min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 flex items-center justify-center">

    <!-- Background Blur Circles -->
    <div class="absolute top-20 left-20 w-72 h-72 bg-purple-500 rounded-full blur-[120px] opacity-40"></div>

    <div class="absolute bottom-10 right-10 w-80 h-80 bg-pink-500 rounded-full blur-[120px] opacity-30"></div>

    <!-- Floating Shapes -->
    <div class="absolute top-24 right-32 w-8 h-8 rounded-full bg-white/30 float-animation"></div>

    <div class="absolute bottom-32 left-20 w-12 h-12 rounded-full bg-purple-300/30 float-animation"></div>

    <div class="container mx-auto px-6">

        <div class="grid lg:grid-cols-2 gap-12 items-center">

            <!-- Content -->
            <div class="text-center lg:text-left slide-left">

                <span class="inline-block px-5 py-2 bg-white/10 backdrop-blur-md rounded-full text-purple-200 border border-white/20 mb-6">
                    Welcome to Our Appointment Portal
                </span>

                <h1 class="text-5xl lg:text-7xl font-black text-white leading-tight">
                    Schedule Your
                    <span class="bg-gradient-to-r from-pink-400 to-purple-300 bg-clip-text text-transparent">
                        Next Visit
                    </span>
                    Effortlessly
                </h1>

                <p class="mt-6 text-lg text-gray-300 max-w-xl">
                    Book appointments in seconds. Fast, secure and hassle-free scheduling experience with our modern platform.
                </p>

                <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">

                    <a href="#appointment"
                       class="glow-btn px-8 py-4 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl text-white font-semibold text-lg hover:scale-105 transition duration-300">
                        Book Appointment
                    </a>

                    <button
                        class="px-8 py-4 border border-white/20 backdrop-blur-md rounded-xl text-white hover:bg-white/10 transition">
                        Learn More
                    </button>

                </div>

                <!-- Stats -->
                <div class="flex flex-wrap gap-10 mt-12 justify-center lg:justify-start">

                    <div>
                        <h3 class="text-3xl font-bold text-white">10K+</h3>
                        <p class="text-gray-400">Appointments</p>
                    </div>

                    <div>
                        <h3 class="text-3xl font-bold text-white">500+</h3>
                        <p class="text-gray-400">Professionals</p>
                    </div>

                    <div>
                        <h3 class="text-3xl font-bold text-white">98%</h3>
                        <p class="text-gray-400">Satisfaction</p>
                    </div>

                </div>

            </div>

            <!-- Illustration -->
            <div class="flex justify-center slide-up">

                <div class="relative">

                    <!-- Glow -->
                    <div class="absolute inset-0 bg-purple-500 rounded-full blur-[100px] opacity-40"></div>

                    <!-- GIF -->
                    <img
                        src="https://media.giphy.com/media/l0MYEqEzwMWFCg8rm/giphy.gif"
                        alt="Appointment Animation"
                        class="relative z-10 w-full max-w-xl rounded-3xl shadow-2xl float-animation"
                    >

                </div>

            </div>

        </div>

    </div>

    <!-- Scroll Indicator -->
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2">

        <div class="w-8 h-14 border-2 border-white/40 rounded-full flex justify-center">
            <div class="w-2 h-3 bg-white rounded-full mt-2 animate-bounce"></div>
        </div>

    </div>

</section>

<script>
    document.querySelector("#bookBtn").addEventListener("click", () => {
    document.querySelector("#appointment").scrollIntoView({
        behavior: "smooth"
    });
});
</script>
</body>
</html>
