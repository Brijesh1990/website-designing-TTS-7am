<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<!-- jquery CDN(content delivery network) -->
<script src="https://code.jquery.com/jquery-4.0.0.js"></script> 
<script>
$(document).ready(function(){
$("#btn").click(function(){
var num=parseInt(prompt("Enter a Numbers :"))
var result="";
for (var i=1; i<=num; i++)
{
if(i%2!==0)
{  
// Display result
result += i + " ";
} 
}

$("#result").html("Odd Numbers are : " + result);
//$("#result").html("Even Numbers are : " + result);
})
})
</script>
</head>
<body>
<p id="result"></p>    
<button type="button" id="btn">Only odd number check in naturals numbers</button>
</body>
</html>
