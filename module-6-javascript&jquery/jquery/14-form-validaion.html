<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="css/gray.css">
   <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="js/jquery.bvalidator.js"></script>
    <script src="js/default.min.js"></script>
    <script src="js/gray.js"></script>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
    $(document).ready(function(){
    
         $("#frm").bValidator();

    })    
    </script>
    <style>
        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-left {
            animation: fadeInLeft 1s ease-out;
        }

        .animate-right {
            animation: fadeInRight 1s ease-out;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-100 via-white to-purple-100 flex items-center justify-center p-26">

    <div class="max-w-7xl p-35 w-full grid lg:grid-cols-2 gap-10 bg-white/70 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden">

        <!-- Left Side GIF -->
        <div class="animate-left relative">
            <img
                src="https://media.giphy.com/media/xTiTnxpQ3ghPiB2Hp6/giphy.gif"
                alt="Appointment Animation"
                class="w-full h-full object-cover min-h-[500px]"
            >

            <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                <div class="text-center text-white px-6">
                    <h2 class="text-4xl font-bold mb-4">
                        Book Your Appointment
                    </h2>
                    <p class="text-lg opacity-90">
                        Schedule your visit quickly and easily.
                    </p>
                </div>
            </div>
        </div>

        <!-- Right Side Form -->
        <div class="p-8 lg:p-12 animate-right">

            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                Appointment Form
            </h1>

            <p class="text-gray-500 mb-8">
                Fill in the details below and we'll get back to you.
            </p>

            <form id="frm" class="space-y-5" action="welcome.html">

                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700">
                        Full Name
                    </label>
                    <input
                        type="text"
                        placeholder="John Doe" data-bvalidator="required,alpha"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 outline-none transition-all duration-300"
                    >
                </div>

                <div class="grid md:grid-cols-2 gap-4">

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Email
                        </label>
                        <input
                            type="email" data-bvalidator="required,email"
                            placeholder="john@example.com"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 outline-none transition-all duration-300"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Phone
                        </label>
                        <input
                            type="tel"
                            placeholder="+91 9876543210" data-bvalidator="required,minlen[10],maxlen[10],digit"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 outline-none transition-all duration-300"
                        >
                    </div>

                </div>

                <div class="grid md:grid-cols-2 gap-4">

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Appointment Date
                        </label>
                        <input
                            type="date" data-bvalidator="required"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 outline-none transition-all duration-300"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Time
                        </label>
                        <input
                            type="time" data-bvalidator="required"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 outline-none transition-all duration-300"
                        >
                    </div>

                </div>

                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700">
                        Service
                    </label>

                    <select data-bvalidator="required"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 outline-none transition-all duration-300"
                    >
                        <option>Select Service</option>
                        <option>Consultation</option>
                        <option>Dental Checkup</option>
                        <option>Health Examination</option>
                        <option>Online Meeting</option>
                    </select>
                </div>

                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-700">
                        Message
                    </label>

                    <textarea data-bvalidator="required"
                        rows="4"
                        placeholder="Additional details..."
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 outline-none transition-all duration-300 resize-none"
                    ></textarea>
                </div>

                <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-xl font-semibold text-lg shadow-lg hover:scale-105 hover:shadow-xl transition-all duration-300"
                >
                    Book Appointment
                </button>

            </form>

        </div>

    </div>

</body>
</html>
