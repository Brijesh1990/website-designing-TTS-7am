<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<!-- jquery CDN(content delivery network) -->
<script src="https://code.jquery.com/jquery-4.0.0.js"></script> 
<script>
$(document).ready(function(){

   $("#btn1").click(function(){
    /*     
    $("#para").hide();
    */ 
    $("#para").hide(4000);
})


   $("#btn2").click(function(){
    /*     
    $("#para").hide();
    */ 
    $("#para").show(4000);
})


   $("#btn3").click(function(){
    /*     
    $("#para").hide();
    */ 
    $("#para").toggle(4000);
})

})    
</script>
<style>
div 
{
 width: 60%;
 height: auto;
 margin: auto;
 padding: 25px;   
}    
button 
{
width: 25%;
height: auto;
margin: auto;
padding: 8px;
border: none;    
}
</style>

</head>
<body>
<div>
 <p id="para">
     Lorem ipsum dolor sit amet consectetur adipisicing elit. Amet in alias totam beatae. Molestiae, consectetur expedita neque fuga quod perspiciatis optio dicta, esse sed quidem obcaecati dolore maiores adipisci possimus!
 </p>   
 <button type="button" id="btn1">Hide</button>
 <button type="button" id="btn2">Show</button>
 <button type="button" id="btn3">Toggle</button>
</div>
</body>
</html>
