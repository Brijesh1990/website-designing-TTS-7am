<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<!-- jquery CDN(content delivery network) -->
<script src="https://code.jquery.com/jquery-4.0.0.js"></script> 
<script>
$(document).ready(function(){
$("#btn").click(function(){
$("b").append("<b>&nbsp;Pandey</b>")
})

$("#btn1").click(function(){
$("b").prepend("<b>Ravindra </b>")
})
})    
</script>
<style>
div 
{
width: 30%;
height: auto;
margin: auto;
padding: 25px;
}
</style>

</head>
<body>
<div>
<b>Brijesh</b>
<br><br>
<button type="button" id="btn1">Prepend</button>    
<button type="button" id="btn">Append</button> 
</div>
</body>
</html>
