<script>
/* 

nested if statements : if within another if that is called nested if statements 

syntax : 

if(condition)
{
  if(condition)
  {
 statements;
  }
}
else 
{
 statements;
}

*/    

let a=100;
let b=70;
if(a>b)
{
    if(a!=0 && b!=0)
    {
    document.write("<h1 align='center'> a is greater than b and both are positive numbers</h1>");
    }
}
else 
{
    document.write("<h1 align='center'> a is less than b</h1>");
}

</script>
