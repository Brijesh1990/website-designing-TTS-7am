<style>
form 
{
width: 50%;
height: auto;
margin: auto;
padding: 20px;    
}    
form input 
{
width: 50%;
height: auto;
padding: 8px;    
}
#result 
{
font-size: 25px;
font-weight: bold;
}
</style>
<script>
function display()
{

let number=document.getElementById("number").value;
if(number%2==0)
{
document.getElementById("result").innerHTML="Number is even"; 
}
else 
{

document.getElementById("result").innerHTML="Number is odd";
}
}
</script>
<center>
<h3>Check odd or even</h3>
<form>
<input type="text" id="number" placeholder="Enter a Numbers *" required />
<br>
<br>
<button type="button" onclick="display()">Click here</button>
</form>
<p id="result"></p>    
</center>
