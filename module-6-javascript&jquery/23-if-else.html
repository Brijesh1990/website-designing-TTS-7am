<script>

/* 

if else statements : if is executed when condition is true if condition is false else is executed

syntax : 

if(condition)
{
 statements;
}
else 
{
 statements;
}

*/    

let a=50;
let b=70;
if(a>b)
{
    document.write("<h1 align='center'> a is greater than b</h1>");
}

else 
{
    document.write("<h1 align='center'> a is less than b</h1>");
}

</script>
