<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
    <style>
        #res{
            font-size: 20px;
            color: red;
        }
        #box{
            width: 30%;
            height: auto;
            margin: auto;
            padding: 20px;
            text-align: center;
            padding-top: 20px;
        }

    </style>
    <script>
        function test()
        {
            document.getElementById("res").style="color:green; font-size: 85px; font-weight: bold; transform: uppercase; text-shadow: 2px 2px 5px red; transition: all 0.2s ease-in-out;";
        }
    </script>
</head>
<body>
    <div id="box">
    <p id="res">Brijesh</p>
    <button onclick="test()">click me</button>
    </div>
</body>
</html>
