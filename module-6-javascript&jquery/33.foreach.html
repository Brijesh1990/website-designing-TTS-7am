<script>
// foreach loop in javascript
/*

The forEach() method executes a provided function once for each array element.
Syntax:

array.forEach(function(currentValue, index, arr), thisValue)
Parameters:

currentValue: The value of the current element being processed in the array.

index (Optional): The index of the current element being processed in the array.

arr (Optional): The array that forEach() is being applied to.
thisValue (Optional): A value to be passed to the function to be used as its this

*/

let employee = ["Rohit", "Suresh", "Ramesh", "Sanjay", "Vijay", "Ajay", "Rahul", "Rakesh", "Suresh", "Rohit"];
console.log(employee);

//array as values 
employee.forEach((items)=>{
    console.log(items);
});
</script>
