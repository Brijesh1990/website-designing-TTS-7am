<script>
// what is while loop in javascript
/*
The while statement creates a loop that executes a specified statement as long as the test condition evaluates to true. The condition is evaluated before executing the statement. If the condition becomes false, the statement within the loop stops executing and control passes to the statement following

syntax:
while (condition) {
  // code block to be executed
}

*/

let i=0;
while(i<=5)
{
    console.log(i);
    i++;
}

</script>
