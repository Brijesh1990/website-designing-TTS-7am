<script>
// do while loop in javascript
/*
The do...while statement creates a loop that executes a specified statement until the test condition evaluates to
false. The condition is evaluated after executing the statement, resulting in the specified statement being executed at least once.
Syntax:
do {
  // code block to be executed
} while (condition);
*/
let i=0;
do{
    console.log(i);
    i++;
}
while(i>=5);
</script>
