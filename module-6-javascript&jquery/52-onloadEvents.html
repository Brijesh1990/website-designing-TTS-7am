<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Page Title</title>
<link rel='stylesheet' href='main.css'>
<style>
.view-cart{
width: 30%;
height: auto;
margin: auto;
padding: 20px;
text-align: center;
padding-top: 20px;
border: 1px solid black;
}
.subtotal{
font-size: 28px;
color: green;
font-weight: bolder;
}
input[type="number"]{
width: 50px;
height: 30px;
text-align: center;
}
input[type="text"]{
width: 50px;
height: 30px;
text-align: center;
}
button{
width: 160px;
height: 40px;
background-color: green;
color: white;
font-size: 18px;
border: none;
border-radius: 5px;
cursor: pointer;
}
button:hover{
background-color: darkgreen;
}

#mainPage{
display: none;
}
#loader
{
width: 450px;
height: 450px;    
position: absolute;
left: 35%;
top: 8%;
/*background: url('images/loader.gif') no-repeat;*/
background: url('images/loader1.png!bw700') no-repeat;
background-size: cover;    
}
</style>

<script>
/* subtotal */
function cartTotal()
{
var price=document.getElementById("price").value;
var quantity=document.getElementById("quantity").value;
var total=price*quantity;
document.getElementById("subtotal").innerHTML=total;
}

/*-- loader js --*/ 

function mainFunction()
{
  setTimeout("loaderApp()",5000);  
}
function loaderApp()
{
document.getElementById("loader").style="display:none";
document.getElementById("mainPage").style="display:block";    
}

</script>
</head>
<body onload="mainFunction()">
<div id="loader"></div>    
<div id="mainPage">    
<!-- view cart with qty -->
<div class="view-cart">
<h2>View Cart</h2>
<p><img src="https://png.pngtree.com/png-vector/20250522/ourmid/pngtree-modern-laptop-computer-with-screen-open-technology-digital-device-png-image_16345445.png" alt="Laptop" width="100" height="100"></p>

<p>Product Name: <span id="product-name">Laptop</span></p>

<p>Quantity: <input type="number" id="quantity" value="1" onchange="cartTotal()"></p>

<p align="center">Price of Products : Rs.
<input type="text" id="price" value="1000" readonly style="border: 0;">
</p>      
<p class="subtotal">Subtotal: Rs.<span id="subtotal">1000</span></p>
<p><button>Add to Cart</button></p>
</div>
</div>
</body>
</html>
