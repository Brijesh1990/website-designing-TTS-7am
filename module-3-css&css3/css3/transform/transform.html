<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <style>
        .app
        {
            width: 40%;
            height: auto;
            margin: auto;
            margin-top: 5%;
        }
        .app img
        {
           width: 80%;
           height: 300px;
           margin: auto;
            transition: 2s ease all;
        }
        .app img:hover
        {
           
            font-size: 50px;
            color: red;
            transform: rotate(360deg);
            border-radius: 50%;
            text-shadow: 2px 10px black;
        }


           .app1
        {
            width: 40%;
            height: auto;
            margin: auto;
            margin-top: 5%;
        }
        .app1 img
        {
           width: 80%;
           height: 300px;
           margin: auto;
           
        }
        .app1 img:hover
        {
           width: 85%;
           height: 350px;
           font-size: 50px;
           color: red;
           text-shadow: 2px 10px black;
          transition: 2s ease all;
        }
    </style>
</head>
<body>

    <div class="app">
      <img src="https://m.media-amazon.com/images/M/MV5BNTk1OTUxMzIzMV5BMl5BanBnXkFtZTcwMzMxMjI0Nw@@._V1_FMjpg_UX1000_.jpg" alt="photo" />
    </div>
    
    
    <div class="app1">
      <img src="https://m.media-amazon.com/images/M/MV5BNTk1OTUxMzIzMV5BMl5BanBnXkFtZTcwMzMxMjI0Nw@@._V1_FMjpg_UX1000_.jpg" alt="photo" />
    </div>
    
</body>
</html>
