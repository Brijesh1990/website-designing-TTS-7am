<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <style>
        .app
        {
            width: 40%;
            height: auto;
            margin: auto;
            margin-top: 5%;
        }
        .app img
        {
           width: 80%;
           height: 300px;
           margin: auto;
           transition: 2s ease all;
        }
        .app img:hover
        {
           
            font-size: 50px;
            color: red;
            transform: skew(5deg,5deg);
            text-shadow: 2px 10px black;
        }

        #btn
        {
            width: 30%;
            height: auto;
            margin: auto;
            margin-top: 5%;
        }
        #btn button 
        {
         width: 60%;
         height: auto;
         margin: auto;
         padding: 20px;
         border: none;
         background-color: red;
         color: white;   
        }
        #btn button:hover 
        {
         width: 60%;
         height: auto;
         margin: auto;
         padding: 20px;
         border: none;
         background-color: blue;
         color: white;   
         /*transform: skew(3deg,3deg); */
         transform: skew(-3deg,-3deg);
         transition: 2s ease all;
         font-size: 24px;
         border-radius: 5px;
        }


    </style>
</head>
<body>

    <div class="app">
      <img src="https://m.media-amazon.com/images/M/MV5BNTk1OTUxMzIzMV5BMl5BanBnXkFtZTcwMzMxMjI0Nw@@._V1_FMjpg_UX1000_.jpg" alt="photo" />
    </div>
    
   <div id="btn">
    <button type="button">Register Now >></button>
   </div>
    
</body>
</html>
